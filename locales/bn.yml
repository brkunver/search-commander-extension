extName: Search Commander
extDescription: Search Commander একটি ব্রাউজার এক্সটেনশন যা আপনাকে কীবোর্ড শর্টকাট ব্যবহার করে ওয়েবে অনুসন্ধান করতে দেয়

content:
  info: "অনুসন্ধান করতে এন্টার টিপুন, বন্ধ করতে Esc"
  search: "অনুসন্ধান..."

popup:
  hint: "অনুসন্ধান খুলতে $1 টিপুন"
  options: "অপশন"
  extensionStatus:
    active: "সক্রিয়"
    inactive: "নিষ্ক্রিয়"

options:
  title: "অপশন"
  shortcut: "শর্টকাট"

welcome:
  title: "Search Commander-এ স্বাগতম!"
  subtitle: "আপনার সেটআপ সম্পন্ন হয়েছে। আপনি এখন যেকোনো জায়গা থেকে সার্চ বার খুলতে পারবেন।"
  shortcut_info: "সার্চ বার খোলার জন্য আপনার ডিফল্ট শর্টকাট হল:"
  change_shortcut_info: "যদি এই শর্টকাটটি কাজ না করে বা আপনি এটি পরিবর্তন করতে চান, তবে আপনি Chrome-এর এক্সটেনশন শর্টকাট পৃষ্ঠা থেকে তা করতে পারেন।"
  button_text: "শর্টকাট পরিবর্তন করুন"
